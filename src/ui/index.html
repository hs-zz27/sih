<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign AI Workbench</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #1B2A4A;
      --grey: #555;
      --light: #F5F5F5;
      --ok: #D9EAD3;
      --refer: #FCE5CD;
      --critical: #F4CCCC;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--light);
      color: var(--grey);
      line-height: 1.6;
    }
    header {
      background: var(--navy);
      color: white;
      padding: 20px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 24px; font-weight: 600; }
    header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

    .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }

    .grid { display: grid; grid-template-columns: 350px 1fr 300px; gap: 30px; }
    @media (max-width: 1200px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 20px;
    }
    .panel h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 100px; }
    input[type="file"] { font-size: 12px; }

    button {
      width: 100%;
      padding: 10px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0F1A2E; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: var(--refer);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .status { font-size: 12px; color: #999; margin-top: 8px; }
    .status.running { color: #4285F4; }
    .status.done { color: #34A853; }
    .status.error { color: #EA4335; }

    .trace { max-height: 600px; overflow-y: auto; }
    .step {
      border-left: 4px solid #ddd;
      padding: 12px;
      margin-bottom: 12px;
      background: #fafafa;
      border-radius: 3px;
    }
    .step.active { border-left-color: #4285F4; background: #f0f7ff; }
    .step.ok { border-left-color: #34A853; }
    .step.error { border-left-color: #EA4335; }

    .step-num {
      font-weight: 600;
      color: var(--navy);
      font-size: 13px;
      margin-bottom: 4px;
    }
    .step-thought { font-size: 13px; color: #666; margin-bottom: 8px; line-height: 1.4; }
    .step-tool {
      background: white;
      padding: 8px;
      border-radius: 3px;
      font-size: 12px;
      font-family: 'Monaco', 'Courier New', monospace;
      margin-bottom: 6px;
    }
    .step-tool strong { color: var(--navy); }

    .sources { margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee; }
    .source {
      font-size: 12px;
      margin-bottom: 12px;
      padding: 8px;
      background: #fffbf0;
      border-left: 3px solid #FFB81C;
      border-radius: 2px;
    }
    .source-label { font-weight: 600; color: var(--navy); }
    .source-text { font-size: 11px; color: #666; margin-top: 4px; line-height: 1.3; }

    .deliverables { margin-top: 16px; }
    .deliverable {
      font-size: 12px;
      padding: 8px;
      background: #f0f7ff;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .deliverable a {
      color: #4285F4;
      text-decoration: none;
      font-weight: 500;
    }

    .network-status {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
      margin-top: 20px;
    }
    .network-status h3 { font-size: 12px; font-weight: 600; color: var(--navy); margin-bottom: 12px; }
    .metric {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .metric:last-child { border-bottom: none; }
    .metric-value {
      font-weight: 600;
      font-family: monospace;
    }
    .metric-value.critical { color: #EA4335; }
    .metric-value.ok { color: #34A853; }
    .metric-value.neutral { color: var(--grey); }

    /* HARDCODED.md 1.4: a replayed run must never be able to pass as live. */
    .replay-banner {
      background: var(--refer);
      border: 1px solid #E8A33D;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #7A4A00;
      margin-bottom: 12px;
    }
    .failed-banner {
      background: var(--critical);
      border: 1px solid #D93025;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #8A1C13;
      margin-bottom: 12px;
    }
    .monitor-note {
      font-size: 10px;
      color: #999;
      margin-top: 10px;
      line-height: 1.35;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sovereign On-Premise Agentic AI Workbench</h1>
    <p>Local inference, local RAG, no external calls — powered by open-weight models</p>
  </header>

  <div class="container">
    <div class="grid">
      <div class="panel">
        <h2>Task Input</h2>

        <div class="form-group">
          <label>Attachment (optional)</label>
          <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.tif">
          <div class="status" id="file-status"></div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="task-text" placeholder="e.g. Review the attached inspection report and draft an approval note"></textarea>
        </div>

        <div class="form-group">
          <label>Task Type (optional - router will guess)</label>
          <select id="task-type">
            <option value="">Auto-detect</option>
            <option value="document">Document (inspection, SOP)</option>
            <option value="code">Code (calculation, script)</option>
            <option value="general">General query</option>
          </select>
        </div>

        <button id="submit-btn" onclick="submitTask()">Run Task</button>
        <div class="status" id="submit-status"></div>
      </div>

      <div class="panel">
        <h2>Agent Step Trace</h2>
        <div id="routing-badge"></div>
        <div class="trace" id="trace"></div>
        <div class="status" id="trace-status"></div>
      </div>

      <div>
        <div class="panel">
          <h2>Results</h2>
          <div id="result-text" style="font-size: 13px; line-height: 1.5; margin-bottom: 16px;"></div>
          <div id="deliverables-pane"></div>
        </div>

        <div class="network-status">
          <h3>Network Monitor <span id="monitor-live" style="font-weight:400;color:#999;">· polling</span></h3>
          <div class="metric">
            <span>External Calls</span>
            <span class="metric-value ok" id="metric-external">0</span>
          </div>
          <div class="metric">
            <span>Local Operations</span>
            <span class="metric-value neutral" id="metric-local">0</span>
          </div>
          <div class="metric">
            <span>Offline Duration</span>
            <span class="metric-value neutral" id="metric-offline">—</span>
          </div>
          <!-- Scope, stated on screen. This is application-level enforcement
               plus an lsof poll of our process tree - not an OS-wide packet
               capture, and the demo must not imply otherwise. -->
          <div class="monitor-note" id="monitor-scope"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Same-origin by default: the UI is served from this FastAPI app, so a
    // relative base avoids CORS entirely. Overridable for dev (npm-served UI
    // pointed at a separately running API on another port).
    const API_BASE = window.WORKBENCH_API_BASE || '';
    let currentTaskId = null;
    let currentFile = null;
    let activeStream = null;
    let running = false;

    // Everything below builds HTML with template literals, and every value in
    // them is model output, OCR text, a file path or a tool result. A single
    // '<' in an OCR'd scan or a print() from run_python would otherwise eat the
    // rest of the trace panel mid-demo, so nothing reaches innerHTML unescaped.
    function esc(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function submitTask() {
      if (running) return;               // a double-click must not start two runs
      const taskText = document.getElementById('task-text').value.trim();
      const taskType = document.getElementById('task-type').value;

      if (!taskText) {
        updateStatus('submit-status', 'Please enter a task description', 'error');
        return;
      }

      running = true;
      document.getElementById('submit-btn').disabled = true;
      updateStatus('submit-status', 'Uploading and starting task...', 'running');
      clearResults();

      try {
        let attachmentPath = null;
        if (currentFile) {
          const uploadFormData = new FormData();
          uploadFormData.append('file', currentFile);
          const uploadResponse = await fetch(`${API_BASE}/api/ingest`, { method: 'POST', body: uploadFormData });
          if (!uploadResponse.ok) {
            // Previously this carried on with source_path undefined and ran the
            // task against an attachment that was never ingested.
            let detail = `HTTP ${uploadResponse.status}`;
            try { detail = (await uploadResponse.json()).detail || detail; } catch (e) {}
            throw new Error(`Upload failed: ${detail}`);
          }
          const uploadResult = await uploadResponse.json();
          attachmentPath = uploadResult.source_path;
          const method = (uploadResult.documents && uploadResult.documents[0]
                          && uploadResult.documents[0].metadata
                          && uploadResult.documents[0].metadata.extraction_method) || 'unknown';
          updateStatus('file-status',
            `Ingested ${uploadResult.page_count} page(s) - ${uploadResult.ocr_pages} via OCR (${method})`);
        }

        const taskPayload = {
          task: taskText,
          attachments: attachmentPath ? [attachmentPath] : [],
          task_type_hint: taskType || null,
        };

        // background=true is what makes the trace live. Without it the POST
        // runs the whole agent loop to completion first, and the "stream" is
        // then a replay of a finished run - a long spinner followed by an
        // instant dump, which is the opposite of the thing worth showing.
        const taskResponse = await fetch(`${API_BASE}/api/tasks?background=true`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(taskPayload),
        });

        if (!taskResponse.ok) throw new Error(`API error: ${taskResponse.status}`);

        const taskData = await taskResponse.json();
        currentTaskId = taskData.task_id;

        updateStatus('submit-status', 'Running...', 'running');
        streamTask(currentTaskId);
      } catch (err) {
        updateStatus('submit-status', `Error: ${err.message}`, 'error');
        finishRun();
      }
    }

    function finishRun() {
      running = false;
      document.getElementById('submit-btn').disabled = false;
    }

    function streamTask(taskId) {
      if (activeStream) activeStream.close();
      const eventSource = new EventSource(`${API_BASE}/api/tasks/${taskId}/stream`);
      activeStream = eventSource;
      let routingShown = false;
      let finished = false;

      eventSource.addEventListener('routing', (evt) => {
        if (routingShown) return;
        const data = JSON.parse(evt.data).payload;
        const badge = document.getElementById('routing-badge');
        // The wire format keys this 'model'; 'model_used' is kept as a fallback.
        const model = data.model || data.model_used || 'unknown';
        badge.innerHTML = `
          <div class="badge" title="${esc(data.reason)}">
            <strong>Model:</strong> ${esc(model)}<br>
            <strong>Type:</strong> ${esc(data.task_type)}
          </div>
        `;
        routingShown = true;
      });

      eventSource.addEventListener('step', (evt) => {
        const step = JSON.parse(evt.data).payload;
        appendStep(step);
        updateStatus('trace-status', `Step ${step.step_number} running...`, 'running');
      });

      eventSource.addEventListener('result', (evt) => {
        const result = JSON.parse(evt.data).payload;
        renderResult(result);
      });

      eventSource.addEventListener('done', () => {
        finished = true;
        eventSource.close();
        activeStream = null;
        updateStatus('trace-status', 'Complete', 'done');
        updateStatus('submit-status', '', '');
        finishRun();
        refreshNetwork();
      });

      eventSource.onerror = () => {
        eventSource.close();
        activeStream = null;
        if (!finished) {
          // A genuine drop, not the normal close that follows 'done'.
          updateStatus('trace-status', 'Stream interrupted before the run finished', 'error');
        }
        finishRun();
      };
    }

    function renderResult(result) {
      const pane = document.getElementById('result-text');
      let html = '';

      // HARDCODED.md 1.3/1.4: a cached replay must be unmistakable on screen.
      const reason = (result.routing_reason || '').toLowerCase();
      const replayed = reason.includes('cached replay')
        || (result.steps || []).some(s => s.metadata && s.metadata.demo_replay);
      if (replayed) {
        html += `<div class="replay-banner">CACHED REPLAY - this is a previously
                 recorded run of this exact task, not a live result.</div>`;
      }

      if (result.status && result.status !== 'completed') {
        html += `<div class="failed-banner">Run status: ${esc(result.status)}${
          result.error ? ' - ' + esc(result.error) : ''}</div>`;
      }

      html += `<div>${esc(result.final_text).replace(/\n/g, '<br>')}</div>`;

      if (result.sources && result.sources.length > 0) {
        html += '<div class="sources"><strong>Sources Cited:</strong>' +
          result.sources.map(src => `
            <div class="source">
              <div class="source-label">${esc(String(src.source_path).split('/').pop())} &bull; page ${esc(src.page)}</div>
              <div class="source-text">"${esc(src.snippet)}"</div>
            </div>
          `).join('') + '</div>';
      }
      pane.innerHTML = html;

      const dlPane = document.getElementById('deliverables-pane');
      if (result.deliverables && result.deliverables.length > 0) {
        dlPane.innerHTML = '<div class="deliverables"><strong>Deliverables:</strong>' +
          result.deliverables.map(dl => `
            <div class="deliverable">
              <span>${esc(dl.filename)} (${Math.max(1, Math.round((dl.size_bytes || 0) / 1024))} KB)</span>
              <a href="${esc(dl.download_url)}" download>&darr;</a>
            </div>
          `).join('') + '</div>';
      } else {
        dlPane.innerHTML = '';
      }
    }

    function appendStep(step) {
      const trace = document.getElementById('trace');
      const stepDiv = document.createElement('div');
      stepDiv.className = `step ${step.status === 'ok' ? 'ok' : 'error'}`;

      let toolHtml = '';
      if (step.tool_name) {
        let args = '';
        try { args = JSON.stringify(step.tool_input || {}); } catch (e) { args = '{}'; }
        toolHtml = `
          <div class="step-tool">
            <strong>${esc(step.tool_name)}</strong>(${esc(args.slice(0, 80))})
          </div>
          <div style="font-size: 11px; color: #666; margin: 6px 0; white-space: pre-wrap;">&rarr; ${
            esc(String(step.tool_output || '').slice(0, 300))}</div>
        `;
      }

      const replayMark = (step.metadata && step.metadata.demo_replay)
        ? ' <span style="color:#B26A00;">[replay]</span>' : '';

      stepDiv.innerHTML = `
        <div class="step-num">Step ${esc(step.step_number)}${replayMark}</div>
        <div class="step-thought">${esc(step.thought)}</div>
        ${toolHtml}
        <div style="font-size: 11px; color: #999; margin-top: 6px;">${
          esc(step.duration_ms)} ms${step.model_used ? ' &bull; ' + esc(step.model_used) : ''}</div>
      `;
      trace.appendChild(stepDiv);
      trace.scrollTop = trace.scrollHeight;
    }

    async function refreshNetwork() {
      try {
        const resp = await fetch(`${API_BASE}/api/network`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const status = await resp.json();

        // Zero external calls is the headline claim - it must not render in
        // alarm-red. Red is reserved for an actual nonzero count.
        const ext = document.getElementById('metric-external');
        ext.textContent = status.external_calls;
        ext.className = 'metric-value ' + (status.external_calls > 0 ? 'critical' : 'ok');

        document.getElementById('metric-local').textContent = status.total_operations;

        const offline = document.getElementById('metric-offline');
        const secs = status.offline_duration_s;
        offline.textContent = (secs === null || secs === undefined)
          ? '—'
          : (secs < 60 ? `${Math.round(secs)} s` : `${Math.round(secs / 60)} min`);

        document.getElementById('monitor-scope').textContent = status.monitor || '';
        document.getElementById('monitor-live').textContent = '· live';
      } catch (err) {
        document.getElementById('monitor-live').textContent = '· unreachable';
      }
    }

    function updateStatus(elemId, text, className) {
      const elem = document.getElementById(elemId);
      elem.textContent = text;
      elem.className = `status ${className || ''}`;
    }

    function clearResults() {
      document.getElementById('trace').innerHTML = '';
      document.getElementById('routing-badge').innerHTML = '';
      document.getElementById('result-text').innerHTML = '';
      document.getElementById('deliverables-pane').innerHTML = '';
      document.getElementById('trace-status').textContent = '';
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      currentFile = e.target.files?.[0] || null;
      if (currentFile) {
        document.getElementById('file-status').textContent = `Selected: ${currentFile.name}`;
      }
    });

    // The sovereignty panel is the thing judges watch during the Wi-Fi-off
    // finale. It used to update only after a task finished, so it sat stale
    // exactly when it mattered most.
    refreshNetwork();
    setInterval(refreshNetwork, 3000);
  </script>
</body>
</html>
