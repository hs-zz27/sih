# Sovereign On-Premise Agentic AI Workbench - runtime configuration.
#
# This file is the ONLY place an endpoint or a path may be written down.
# PROPOSAL.md ss2.3: "Design the model layer so the endpoint is a config value",
# so the same code runs against a laptop Ollama or the GPU box without edits.
#
# Every host here must be loopback or a LAN address. A public hostname in this
# file is a P0 bug - it breaks the sovereign claim.

app:
  name: "Sovereign AI Workbench"
  # Directory the API serves generated deliverables from.
  downloads_dir: "data/downloads"
  uploads_dir: "data/uploads"
  corpus_dir: "data/corpus"
  index_dir: "data/index"
  audit_log: "logs/audit.jsonl"

inference:
  # Local inference server. Swap this line to move between laptop and GPU box.
  endpoint: "http://127.0.0.1:11434"
  api_style: "ollama"          # ollama | openai-compatible (vLLM exposes the latter)
  request_timeout_s: 120
  stream: true
  keep_alive: "30m"            # keep weights resident so the demo has no reload stall
  # Qwen3.5 emits <think>...</think> reasoning before its answer. It is useful
  # for quality and fatal for demo latency, so it is off by default. The agent
  # strips the tags either way, so turning it on cannot break parsing.
  enable_thinking: false

# M2 - one model per task type. On the MVP these may point at the same model
# with different system prompts and sampling params; the requirement is that the
# routing decision is VISIBLE, not that the models differ.
#
# Qwen3.5-4B (Apache 2.0, March 2026). Chosen over the 7B class for three
# reasons that matter to this submission specifically:
#   * Speed. 3.4 GB and 4B parameters, so it answers fast on a fanless laptop.
#     A 7B dense model was the demo's biggest latency and thermal risk.
#   * Native tool calling, which is what the agent loop lives or dies on.
#   * Natively multimodal (text + image). The problem statement asks for
#     multimodal open-weight LLMs, so the vision path is the same weights.
# The 9B variant is a drop-in for the GPU box: change these lines only.
models:
  document: "qwen3.5:4b"
  code: "qwen3.5:4b"
  general: "qwen3.5:4b"
  vision: "qwen3.5:4b"         # same weights - the model is natively multimodal

agent:
  max_steps: 8                 # M4 - hard cap. A runaway loop mid-demo is fatal.
  wall_clock_timeout_s: 180
  temperature: 0.2

rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  # Weights are pre-cached here; nothing is downloaded at runtime.
  embedding_cache_dir: "models/embeddings"
  collection: "mrpl_corpus"
  chunk_size: 800
  chunk_overlap: 120
  top_k: 5

sandbox:
  timeout_s: 20
  workdir: "data/sandbox"
  network: false               # M5 - no egress from generated code, ever.

ingestion:
  ocr_engine: "tesseract"      # tesseract | paddle
  ocr_lang: "eng"
  ocr_dpi: 300
  # Below this many characters on a page, treat the text layer as empty and OCR it.
  text_layer_min_chars: 40

# MVP demo scaffolding. Everything switched on here is also listed in
# HARDCODED.md - if you add a shortcut, record it there too.
demo:
  enabled: true
  # Pin sampling to greedy so a rehearsed run takes the same path twice. This is
  # also simply the right setting for extraction and citation work.
  deterministic: true
  # Replay a previously recorded run ONLY if live inference fails, and only for
  # an exact-match preset task. Replays are stamped demo_replay and carry a
  # banner in the final text, so they can never pass as live. Set false to make
  # the demo fail visibly instead.
  fallback_enabled: true
  cache_dir: "data/demo_cache"

audit:
  enabled: true
  # H4 - hosts the egress monitor is allowed to see. Anything else counts as
  # an external call and must surface in the UI as a violation.
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    - "::1"
  # H4 - how often the out-of-process lsof observer polls. Lower = more
  # responsive corroboration, higher = less overhead during the demo.
  monitor_interval_s: 2.0

server:
  host: "127.0.0.1"
  port: 8000
  # The UI is served from the same origin in the demo; this is dev-only.
  cors_origins:
    - "http://127.0.0.1:5173"
    - "http://localhost:5173"
